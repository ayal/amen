<!doctype html>
<html lang="en" data-theme="synthwave">
<head>
<meta charset="utf-8">
<title>Amen — break machine</title>
<meta name="description" content="A tiny step sequencer for chopping up classic breakbeats, built with the Web Audio API.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a103c">
<link rel="icon" href="favicon.ico">
<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen bg-base-300 text-base-content">
  <main class="max-w-2xl mx-auto px-3 sm:px-6 py-6 sm:py-10">

    <header class="text-center mb-6">
      <h1 class="title-gradient text-5xl sm:text-6xl font-black tracking-tight">
        Amen
      </h1>
      <p class="text-xs sm:text-sm uppercase tracking-[0.35em] text-base-content/60 mt-1">Break Machine</p>
    </header>

    <section class="card bg-base-100/70 shadow-xl border border-base-content/10 backdrop-blur mb-5">
      <div class="card-body gap-4 p-4 sm:p-6">

        <div class="flex flex-wrap items-center gap-2">
          <button id="playBtn" class="btn btn-primary min-w-[7rem]" disabled>Loading&hellip;</button>

          <select id="presetSelect" class="select select-bordered select-primary flex-1 min-w-[9rem]" aria-label="Preset"></select>

          <select id="kitSelect" class="select select-bordered select-secondary flex-1 min-w-[9rem]" aria-label="Sound kit" title="Sound kit"></select>

          <div class="join">
            <button id="reloadBtn" class="btn btn-ghost join-item" title="Reload preset" aria-label="Reload preset">&#8635;</button>
            <button id="clearBtn" class="btn btn-ghost join-item" title="Clear grid" aria-label="Clear grid">&#10005;</button>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <label class="w-full">
            <div class="flex justify-between items-center mb-1">
              <span class="text-xs uppercase tracking-wider text-base-content/60">Tempo</span>
              <span id="tempoValue" class="badge badge-primary badge-outline badge-sm font-mono">500</span>
            </div>
            <input id="tempo" type="range" min="0" max="600" step="50" value="500" class="range range-primary range-xs w-full">
          </label>

          <label class="w-full">
            <div class="flex justify-between items-center mb-1">
              <span class="text-xs uppercase tracking-wider text-base-content/60">Volume</span>
              <span id="volumeValue" class="badge badge-secondary badge-outline badge-sm font-mono">100%</span>
            </div>
            <input id="volume" type="range" min="0" max="100" step="1" value="100" class="range range-secondary range-xs w-full">
          </label>
        </div>

      </div>
    </section>

    <div id="grid" class="flex flex-col gap-3"></div>

    <footer class="text-center text-xs text-base-content/50 mt-8">
      <p>A decade-old amen break sequencer, dusted off &mdash; <a class="link link-primary" href="https://github.com/ayal/amen">source</a></p>
    </footer>

  </main>

  <script src="app.js"></script>
</body>
</html>
